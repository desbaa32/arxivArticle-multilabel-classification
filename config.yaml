project:
  name: arxivArticle-multilabel-classification
  version: 1.0.0
  description: Multi-label classification of scientific articles using PySpark

spark:
  app_name: ArXivArticle-Classification'
  master: "spark://tawfekh-d:7077"  # Remplacer par cluster URL en production
  memory: 4g
  executor_memory: 2g
  driver_memory: 2g
  shuffle_partitions: 200
  sql_adaptive_enabled: true
  
data:
  raw_path:  "data/raw/arxiv-metadata-oai-snapshot.json"
  processed_path: "data/processed/"
  models_path: data/models
  sample_size: 50000  # Pour tests rapides
  top_categories: 30   # Pour développement rapide
  
preprocessing:
  text_columns: ["title", "abstract"]
  combine_text: true
  min_text_length: 100
  language: "english"

features:
  vocab_size: 5000
  use_tfidf: true
  use_word2vec: false  # Trop lent sur grandes données
  use_ngrams: true
  ngram_range: [1, 2]

models:
  binary_relevance:
    classifier: "logistic_regression"
    regularization: 0.01
    max_iter: 100
    
  classifier_chains:
    classifier: "random_forest"
    num_trees: 50
    max_depth: 10

evaluation:
  test_size: 0.2
  validation_size: 0.1
  metrics: ["hamming_loss", "subset_accuracy", "micro_f1", "macro_f1"]
  
logging:
  level: "INFO"
  file: "logs/project.log"
